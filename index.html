<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mini Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>🐹 Mini Miner</h1>
      <div class="stats">
        <span>Монеты: <b id="coins">0</b></span>
        <span>Сложность: <b id="difficulty">5</b></span>
      </div>

      <div class="miner-box">
        <div class="hash-display" id="hashDisplay">--</div>
        <div class="progress-bar-container">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <p class="status-text" id="statusText">Готов к майнингу</p>
      </div>

      <button id="tapBtn" class="tap-btn">Начать майнинг (клик)</button>
      <div class="controls">
        <button id="buyDifficultyBtn" class="control-btn">Повысить сложность (+100 монет)</button>
        <button id="buyPassiveBtn" class="control-btn">Пассивный доход (+1 монета/сек)</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
